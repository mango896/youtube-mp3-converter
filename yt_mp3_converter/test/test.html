<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to MP3 Converter - Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }
        
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .status.loading {
            background: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
            display: block;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .download-btn {
            display: none;
            margin-top: 15px;
        }
        
        .file-info {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 YouTube to MP3 Converter</h1>
        <p class="subtitle">Convert YouTube videos to MP3 format instantly!</p>
        
        <div class="input-group">
            <label for="videoUrl">Paste YouTube URL:</label>
            <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required>
        </div>
        
        <div class="input-group">
            <label for="quality">Audio Quality:</label>
            <select id="quality">
                <option value="best">Best (Highest Quality)</option>
                <option value="high" selected>High (256kbps)</option>
                <option value="standard">Standard (192kbps)</option>
                <option value="low">Low (128kbps)</option>
            </select>
        </div>
        
        <button id="convertBtn" onclick="startConversion()">⬇️ Convert to MP3</button>
        
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="status" id="statusMessage"></div>
        
        <button class="download-btn" id="downloadBtn" onclick="downloadFile()">💾 Download MP3</button>
        <div class="file-info" id="fileInfo"></div>
    </div>

    <script>
        let downloadUrl = '';
        
        function startConversion() {
            const url = document.getElementById('videoUrl').value;
            const quality = document.getElementById('quality').value;
            const status = document.getElementById('statusMessage');
            const convertBtn = document.getElementById('convertBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            if (!url) {
                status.className = 'status error';
                status.innerHTML = '❌ Please enter a YouTube URL';
                return;
            }
            
            // Reset UI
            status.className = 'status loading';
            status.innerHTML = '🔄 Converting... This may take a moment.';
            convertBtn.disabled = true;
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            
            // Simulate progress
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 90) progress = 90;
                progressFill.style.width = progress + '%';
            }, 300);
            
            // Call API after delay to allow progress bar to show
            setTimeout(() => {
                clearInterval(interval);
                
                fetch('/api/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        video_url: url,
                        quality: quality
                    })
                })
                .then(response => response.json())
                .then(data => {
                    clearInterval(interval);
                    progressFill.style.width = '100%';
                    
                    if (data.success) {
                        status.className = 'status success';
                        status.innerHTML = `✅ Conversion successful! <br><strong>File:</strong> ${data.file_name} <br><strong>Size:</strong> ${data.file_size} <br><strong>Quality:</strong> ${data.quality}`;
                        
                        downloadUrl = data.download_url;
                        document.getElementById('downloadBtn').style.display = 'block';
                        document.getElementById('fileInfo').textContent = 'Click "Download MP3" to save the file!';
                    } else {
                        status.className = 'status error';
                        status.innerHTML = `❌ Error: ${data.error}`;
                    }
                    
                    convertBtn.disabled = false;
                })
                .catch(error => {
                    clearInterval(interval);
                    status.className = 'status error';
                    status.innerHTML = `❌ Connection error: ${error.message}`;
                    convertBtn.disabled = false;
                });
            }, 1500);
        }

        function downloadFile() {
            if (downloadUrl) {
                window.location.href = downloadUrl;
            }
        }
    </script>
</body>
</html>
